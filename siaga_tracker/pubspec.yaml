name: siaga_tracker
description: "A new Flutter project for SIAGA Mobile Tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: 2.24.2
  firebase_auth: 4.15.3
  firebase_database: 10.4.0
  geolocator: 10.1.0
  permission_handler: 11.3.0
  image_picker: ^1.2.1
  battery_plus: ^6.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  flutter_webrtc: ^1.4.1
  path_provider: ^2.1.5
  livekit_client: ^2.5.0+hotfix.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
